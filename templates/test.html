<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
</head>
<body style="background-color: bisque ;">
    <div style="display: flex;width: 100%;justify-content: center;gap: 20vw;">
        <div style="flex: 1;text-align: left;">Question: {{qn_no}}/{{max_qn}} </div>
        <div style="flex: 1;text-align: center;">Current Score:{{score}} </div>
        <div style="flex: 1;text-align: right;">Coins:{{coins}} 🪙</div>
    </div>
    <p>Category:{{category}} </p>
    <hr>
    <div style="display: flex;text-align: left;border: solid white; padding: 2.5vw;margin-top: 5vw;">
        {{question}}
    </div>
    <form action="/answer" method="post">
        <div style="display: grid;grid-template-columns: 1fr 1fr;gap: 2vw;justify-content: center;margin-top: 7vw;">
        {% for option in options %}
        <button type="submit" name="option" value="{{option}}" style="padding: 1vw;"  >{{option}} </button>
        {% endfor %}
    </div>
    {% if lack %}
    <p style="color: red;"><b>Not enough coins!</b></p>
    {% endif %}
    {% if sec_hint %}
    <p style="color: red;">Can be used only once per question.</p>
    {% endif %}
    20🪙<button type="submit" name="hint" value="True">Hint</button>#Removes two options
    </form>
    <p><a href="/prehome">[ Quit ] </a></p>
</body>
